name: keep-supabase-alive
on:
  schedule:
    - cron: '17 2,14 * * *'   # 2 veces al día, minuto 17 para evitar la congestión de la hora en punto
  workflow_dispatch:

permissions:
  actions: write   # necesario para el keepalive

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert heartbeat
        run: |
          curl --fail -s -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}'

      - name: Select heartbeat
        run: |
          curl --fail -s \
            "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

      - uses: gautamkrishnar/keepalive-workflow@v2   # evita el auto-disable a los 60 días
